・左上の「📁フォルダ」で、フォルダの切り替え・作成・削除ができます。

・並び替えは、更新順・作成順・タイトル順・文字数順から選べます。

function cleanBubble(b){b=b||{};const o={};
 if(typeof b.img==="string"&&/^data:image\//.test(b.img))o.img=b.img;

// 告知ファイル(announce.txt)の書式: 告知ごとに「項目: 値」の行 → 「---」の行 → 本文。告知と告知の間は「=====」の行
function annToText(o){const b=o.bubble||{},one=s=>String(s||"").replace(/[\r\n]+/g," ");
 const L=["on: "+(o.on?1:0),"id: "+o.id,"title: "+one(o.title)];
 if(b.font)L.push("font: "+b.font);if(b.color)L.push("color: "+b.color);if(b.img)L.push("img: "+b.img);
 if(b.fontData){L.push("fontdata: "+b.fontData);L.push("fontname: "+one(b.fontName))}
 L.push("---");L.push(String(o.text||"").replace(/^={5,}$/gm,"===="));return L.join("\n")}
function annsToText(list){return ["# ローカルバトロワ空間 告知ファイル(アプリが自動で書き込みます。手で編集しないでください)"].concat(list.map(a=>annToText({...a,on:1}))).join("\n=====\n")}
function textToAnn(t){t=String(t).replace(/\r/g,"");const i=t.indexOf("\n---\n");if(i<0)return null;
 const m={};t.slice(0,i).split("\n").forEach(l=>{const k=l.indexOf(": ");if(l[0]!=="#"&&k>0)m[l.slice(0,k)]=l.slice(k+2)});
 const body=t.slice(i+5);if(m.on!=="1"||!m.id||!body.trim())return null;
 return{id:m.id,title:(m.title||"").slice(0,80),text:body.slice(0,3000),bubble:cleanBubble({img:m.img,font:m.font,color:m.color,fontData:m.fontdata,fontName:m.fontname})}}
function textToAnns(t){const seen=new Set();return String(t).replace(/\r/g,"").split(/\n={5}\n/).map(textToAnn).filter(a=>a&&!seen.has(a.id)&&seen.add(a.id)).slice(0,MAXANN)}

// GitHub: 公開中の announce.txt を読み、変更を加えて保存する(他の告知を消さないよう、保存の直前に最新を読み直します)
async function ghGet(){const repo=(S.hostRepo||defaultRepo()).trim();
 if(!/^[\w.-]+\/[\w.-]+$/.test(repo))throw new Error("リポジトリ名は「ユーザー名/リポジトリ名」の形で入力してください");
 if(!HOSTTOKEN)throw new Error("GitHubトークンを入力してください");
 const api=`https://api.github.com/repos/${repo}/contents/announce.txt`,H={Authorization:"Bearer "+HOSTTOKEN,Accept:"application/vnd.github+json"};
 const g=await fetch(api,{headers:H});
 if(g.status===404)return{api,H,sha:undefined,list:[]};
 if(!g.ok)throw new Error(g.status===401?"トークンが正しくありません(401)":"GitHubに接続できません("+g.status+")");
 const j=await g.json();let b=j.content;
 if(!b||j.encoding!=="base64"){const bl=await(await fetch(j.git_url,{headers:H})).json();b=bl.content}
 const text=new TextDecoder().decode(Uint8Array.from(atob(String(b).replace(/\s/g,"")),c=>c.charCodeAt(0)));
 return{api,H,sha:j.sha,list:textToAnns(text)}}
async function ghUpdate(mod,msg){const g=await ghGet(),next=mod(g.list.slice()).slice(0,MAXANN);
 const p=await fetch(g.api,{method:"PUT",headers:{...g.H,"Content-Type":"application/json"},body:JSON.stringify({message:msg,content:toB64(annsToText(next)),sha:g.sha})});
 if(!p.ok)throw new Error(p.status===403||p.status===404?"保存する権限がありません("+p.status+")。トークンの権限(Contents: Read and write)と対象リポジトリを確認してください":p.status===409||p.status===422?"同時に更新されました。もう一度お試しください("+p.status+")":"保存に失敗しました("+p.status+")");
 return next}

 <small>② 位置・大きさを、全場面にそろえます</small><br><button class="b y" id="bulkpos">📐 位置を一括調整</button>
 <small><br>③ 各場面の「🌐 これを全場面に」で、その場面の立ち絵と位置を全場面にコピーできます</small><br>
 <button class="b g" id="bulkdel">すべての立ち絵画像を削除</button></div>\n `}
function bindBulk(){
 $("#bulkimg").onchange=e=>{const f=e.target.files[0];if(!f)return;
  if(!confirm("すべての場面の立ち絵を、この画像に置き換えます。(セリフは変わりません)")){e.target.value="";return}
  resize(f,1200,d=>{bulkSetImage(newImgRef(d),$("#bulkreset").checked);renderSettings();say("settings","navSet");alert("すべての場面に設定しました")})};
 $("#bulkpos").onclick=()=>openPVAll();
 $("#bulkdel").onclick=()=>{if(!confirm("すべての場面の立ち絵画像を削除します。(セリフ・位置の設定は残ります)"))return;allEvents().forEach(([s,e])=>{if(S.nav[s]&&S.nav[s][e])delete S.nav[s][e].img});gcNavImgs();save();renderSettings();say("settings","navSet")};
 document.querySelectorAll("[data-all]").forEach(b=>b.onclick=()=>{const[s,e]=b.dataset.all.split("|");const n=(S.nav[s]||{})[e]||{};
  if(!n.img)return alert("この場面には立ち絵画像が設定されていません。");
  if(!confirm(`「${EV[s].name}／${EV[s].e[e]}」の立ち絵と位置を、すべての場面に設定します。(セリフは変わりません)`))return;
  let ref=n.img;if(!String(ref).startsWith("ref:")){ref=newImgRef(ref);n.img=ref}
  const p=pos(s,e);allEvents().forEach(([s2,e2])=>{S.nav[s2]=S.nav[s2]||{};S.nav[s2][e2]=S.nav[s2][e2]||{};S.nav[s2][e2].img=ref;S.pos[s2+"."+e2]={...p}});
  gcNavImgs();save();renderSettings();say("settings","navSet");alert("すべての場面に設定しました")})}
function openPVAll(){const first=()=>{for(const [s,e] of allEvents()){const v=imgOf(((S.nav[s]||{})[e]||{}).img);if(v)return v}return""};
 const src=imgOf(((S.nav.memo||{}).def||{}).img)||first();
 if(!src)return alert("先に立ち絵画像を設定してください。(上の①で一括設定できます)");
 clearTimeout(NT);document.body.classList.add("pv");
 let P={...POSDEF,...(S.pos["memo.def"]||{})};
 const ap=()=>{const i=$("#nimg");i.style.height=P.h+"%";i.style.top=P.y+"%";i.style.right=(-P.x)+"%"};ap();
 trim(src,u=>{$("#nimg").src=u;$("#nimg").classList.remove("hide")});
 $("#nbub").textContent="セリフの表示位置(サンプル)";$("#nbub").classList.remove("hide");
 const bar=$("#pvbar"),rows=[["h","大きさ",60,240],["y","上下(＋で下へ)",-60,80],["x","左右(＋で右へ)",-60,60]];
 bar.innerHTML=`<b>全場面の位置を一括調整</b>`+rows.map(([k,l,a,b])=>`<label>${l}: <span id="pa_${k}">${P[k]}</span>%<input type="range" data-k="${k}" min="${a}" max="${b}" value="${P[k]}"></label>`).join("")+`<button class="b g" id="par">初期値に戻す</button><button class="b" id="pao">この位置を全場面に適用</button><button class="b g" id="pax">キャンセル</button>`;
 bar.classList.remove("hide");
 bar.querySelectorAll("input[type=range]").forEach(r=>{r.oninput=()=>{P[r.dataset.k]=+r.value;$("#pa_"+r.dataset.k).textContent=r.value;ap()}});
 const close=()=>{document.body.classList.remove("pv");bar.classList.add("hide");say("settings","navSet")};
 $("#par").onclick=()=>{P={...POSDEF};bar.querySelectorAll("input[type=range]").forEach(r=>{r.value=P[r.dataset.k];$("#pa_"+r.dataset.k).textContent=P[r.dataset.k]});ap()};
 $("#pao").onclick=()=>{allEvents().forEach(([s,e])=>{S.pos[s+"."+e]={...P}});save();close();alert("すべての場面の位置をそろえました")};
 $("#pax").onclick=close}
gcNavImgs();
wall();loadBubbleFont(applyBubbleAll);go("memo");setTimeout(checkAnnounce,300);setTimeout(askStripImgs,500);
</script></body></html>
